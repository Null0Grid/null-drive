# CI: runs on every push and PR, and is reused by release.yml as a gate
# (a tag can only be released if this passes).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test (race detector)
        run: go test -race -count=1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5

  ui:
    name: UI tests + type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: svelte-check (types + a11y)
        run: npm run check
      - name: Vitest
        run: npm test

  e2e:
    name: Build, smoke + Playwright e2e
    runs-on: ubuntu-latest
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build (UI embedded in a static binary)
        run: make build
      - name: API smoke test
        run: ./scripts/smoke.sh bin/nulldrive
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        working-directory: ui
        run: npx playwright test --project=e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  docker:
    name: Docker build (amd64 + arm64, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate deploy templates
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/casaos/Apps/NullDrive/docker-compose.yml config -q
          docker compose -f deploy/truenas/docker-compose.yaml config -q
          xmllint --noout deploy/unraid/nulldrive.xml

  desktop:
    name: Desktop client (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - name: Shared packages on Windows (paths, sync engine)
        run: go test ./shared/...
      - name: Frontend type check + tests
        working-directory: client/frontend
        run: |
          npm ci
          npm run check
          npm test
      - name: Go vet + tests (client, real Windows)
        working-directory: client
        run: |
          go vet ./...
          go test ./...
      - name: Build NullDrive.exe natively (same flags as scripts/build-windows.sh)
        working-directory: client
        run: |
          (cd frontend && npm run build)
          go build -tags desktop,production -trimpath -ldflags "-H windowsgui -X main.version=ci-${GITHUB_SHA::7}" -o build/bin/NullDrive.exe .

  windows-installer:
    name: Windows installer (cross-built on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Build installer, portable zip and winget manifests
        run: scripts/build-windows.sh "0.0.0-ci.${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v4
        with:
          name: NullDrive-windows
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 14

  msix:
    name: Microsoft Store package (MSIX)
    needs: windows-installer
    # MakeAppx and MakePri come with the Windows SDK on the Windows image.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NullDrive-windows
          path: dist
      - name: Take NullDrive.exe from the portable zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "NullDrive_*_windows_amd64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath portable
          New-Item -ItemType Directory -Force client/build/bin | Out-Null
          $exe = Get-ChildItem portable -Recurse -Filter NullDrive.exe | Select-Object -First 1
          Copy-Item $exe.FullName client/build/bin/NullDrive.exe
      - name: Build the MSIX (test identity)
        shell: bash
        run: scripts/build-msix.sh "0.0.0-ci.${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v4
        with:
          name: NullDrive-msix
          path: dist/*.msix
          retention-days: 14

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: actionlint (pinned)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
