# CI: runs on every push to main and on pull requests, and is reused by
# release.yml as a gate (a tag can only be released if this passes).
#   Linux:   Go tests (race) + lint, go.mod/go.sum tidy, web app tests and type
#            check, build + API smoke test + Playwright e2e, the E2EE
#            reference client, release packaging (.deb installed for real,
#            Docker archive run), Docker build, deploy templates, workflows
#   Windows: shared Go packages, the desktop client (Go + frontend), a native
#            NullDrive.exe build, the MSIX package
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (release.yml passes the tag)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy (server and desktop client)
        run: |
          go mod tidy -diff
          (cd client && go mod tidy -diff)
      - name: Test (race detector)
        run: go test -race -count=1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

  ui:
    name: UI tests + type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: svelte-check (types + a11y)
        run: npm run check
      - name: Vitest
        run: npm test

  e2e:
    name: Build, smoke + Playwright e2e
    runs-on: ubuntu-latest
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build (UI embedded in a static binary)
        run: make build
      - name: API smoke test
        run: ./scripts/smoke.sh bin/nulldrive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: E2EE reference client (test vectors + live flow against the binary)
        run: |
          pip install pynacl
          ./scripts/e2ee-reference/run.sh bin/nulldrive
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        working-directory: ui
        run: npx playwright test --project=e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  docker:
    name: Docker build (amd64 + arm64, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate deploy templates
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/casaos/Apps/NullDrive/docker-compose.yml config -q
          docker compose -f deploy/truenas/docker-compose.yaml config -q
          xmllint --noout deploy/unraid/nulldrive.xml

  desktop:
    name: Desktop client (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/frontend/package-lock.json
            ui/package-lock.json
      - name: Shared packages on Windows (paths, sync engine)
        run: go test ./shared/...
      - name: Frontend type check + tests
        working-directory: client/frontend
        run: |
          # The desktop app type-checks the shared components in ../../ui,
          # which need ui's own packages (their types) installed too.
          (cd ../../ui && npm ci --no-audit --no-fund)
          npm ci
          npm run check
          npm test
      - name: Go vet + tests (client, real Windows)
        working-directory: client
        run: |
          go vet ./...
          go test ./...
      - name: Build NullDrive.exe natively (same flags as scripts/build-windows.sh)
        working-directory: client
        run: |
          (cd frontend && npm run build)
          go build -tags desktop,production -trimpath -ldflags "-H windowsgui -X main.version=ci-${GITHUB_SHA::7}" -o build/bin/NullDrive.exe .

  windows-installer:
    name: Windows installer (cross-built on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Build installer, portable zip and winget manifests
        run: scripts/build-windows.sh "$(node -p "require('./client/wails.json').info.productVersion")-ci.${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v4
        with:
          name: NullDrive-windows
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 14

  msix:
    name: Microsoft Store package (MSIX)
    needs: windows-installer
    # MakeAppx and MakePri come with the Windows SDK on the Windows image.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: NullDrive-windows
          path: dist
      - name: Take NullDrive.exe from the portable zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "NullDrive_*_windows_amd64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath portable
          New-Item -ItemType Directory -Force client/build/bin | Out-Null
          $exe = Get-ChildItem portable -Recurse -Filter NullDrive.exe | Select-Object -First 1
          Copy-Item $exe.FullName client/build/bin/NullDrive.exe
      - name: Build the MSIX (test identity)
        shell: bash
        run: scripts/build-msix.sh "$(node -p "require('./client/wails.json').info.productVersion")-ci.${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v4
        with:
          name: NullDrive-msix
          path: dist/*.msix
          retention-days: 14

  packages:
    name: Release packaging (.deb + Docker archive, installed and run)
    runs-on: ubuntu-24.04
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build what release.yml builds
        run: |
          make ui-build
          ./scripts/build-release.sh v0.0.0-ci "$(git rev-parse --short HEAD)"
          ./scripts/build-deb.sh 0.0.0-ci dist
          ./scripts/build-image-offline.sh 0.0.0-ci dist
          ls -la dist
      - name: Install the .deb (systemd starts the service)
        run: |
          sudo apt-get install -y ./dist/nulldrive_0.0.0-ci_amd64.deb
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8080/api/v1/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'
          systemctl is-active nulldrive
          test "$(stat -c %U /var/lib/nulldrive/nulldrive.db)" = nulldrive
          sudo apt-get purge -y nulldrive
          if systemctl is-active --quiet nulldrive; then echo "::error::still running after purge"; exit 1; fi
          test -d /var/lib/nulldrive   # data is kept, even on purge
      - name: Load and run the Docker archive
        run: |
          docker load -i dist/nulldrive_0.0.0-ci_docker_amd64.tar
          docker run -d --name nd -p 18080:8080 nulldrive:0.0.0-ci
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:18080/api/v1/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/api/v1/health | grep -q '"version":"v0.0.0-ci"'
          docker exec nd /nulldrive version | grep -q v0.0.0-ci

  actionlint:
    name: Lint workflows, versions, scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: actionlint (pinned)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
      - name: App version is the same everywhere
        run: |
          app=$(python3 -c "import json;print(json.load(open('client/wails.json'))['info']['productVersion'])")
          for f in ui/package.json client/frontend/package.json; do
            v=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$f")
            if [ "$v" != "$app" ]; then echo "::error file=$f::version $v, but client/wails.json says $app"; exit 1; fi
          done
          echo "version $app"
      - name: Shell scripts (shellcheck)
        run: shellcheck scripts/*.sh scripts/e2ee-reference/*.sh
