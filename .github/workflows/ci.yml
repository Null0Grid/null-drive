# CI: runs on every push to main and on pull requests, and is reused by
# release.yml as a gate (a tag can only be released if this passes).
#   Linux:   Go tests (race) + lint, go.mod/go.sum tidy, web app tests and type
#            check, build + API smoke test + Playwright e2e, the E2EE
#            reference client, release packaging (.deb installed for real,
#            Docker archive run), Docker build, deploy templates, workflows
#   Linux desktop app: AppImage, .rpm, .deb, .tar.gz built, checked,
#            installed, and a real sync under Xvfb with the Secret Service keyring
#   Windows: shared Go packages, the desktop client (Go + frontend), a native
#            NullDrive.exe build, the MSIX package
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (release.yml passes the tag)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy (server and desktop client)
        run: |
          # The diff (or download error) is repeated as annotations.
          status=0
          for dir in . client; do
            if ! (cd "$dir" && go mod tidy -diff) > "$RUNNER_TEMP/tidy.log" 2>&1; then
              status=1
              cat "$RUNNER_TEMP/tidy.log"
              head -40 "$RUNNER_TEMP/tidy.log" | sed "s|^|::error::go mod tidy ($dir): |"
            fi
          done
          exit "$status"
      - name: Test (race detector)
        run: |
          # Failures are repeated as annotations, so they show on the run's
          # summary page without opening the log.
          set +e
          go test -race -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          grep -E -A4 -- '--- FAIL|^panic:|WARNING: DATA RACE' "$RUNNER_TEMP/test.log" | head -60 | sed 's/^/::error::/'
          exit "$status"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  ui:
    name: UI tests + type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: svelte-check (types + a11y)
        run: npm run check
      - name: Vitest
        run: npm test

  e2e:
    name: Build, smoke + Playwright e2e
    runs-on: ubuntu-latest
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build (UI embedded in a static binary)
        run: make build
      - name: API smoke test
        run: ./scripts/smoke.sh bin/nulldrive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: E2EE reference client (test vectors + live flow against the binary)
        run: |
          pip install pynacl
          ./scripts/e2ee-reference/run.sh bin/nulldrive
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        working-directory: ui
        run: npx playwright test --project=e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  docker:
    name: Docker build (amd64 + arm64, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate deploy templates
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/casaos/Apps/NullDrive/docker-compose.yml config -q
          docker compose -f deploy/truenas/docker-compose.yaml config -q
          xmllint --noout deploy/unraid/nulldrive.xml

  desktop:
    name: Desktop client (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/frontend/package-lock.json
            ui/package-lock.json
      - name: Shared packages on Windows (paths, sync engine)
        run: go test ./shared/...
      - name: Frontend type check + tests
        working-directory: client/frontend
        run: |
          # The desktop app type-checks the shared components in ../../ui,
          # which need ui's own packages (their types) installed too.
          (cd ../../ui && npm ci --no-audit --no-fund)
          npm ci
          npm run check
          npm test
      - name: Go vet + tests (client, real Windows)
        working-directory: client
        run: |
          go vet ./...
          go test ./...
      - name: Build NullDrive.exe natively (same flags as scripts/build-windows.sh)
        working-directory: client
        run: |
          (cd frontend && npm run build)
          go build -tags desktop,production -trimpath -ldflags "-H windowsgui -X main.version=ci-${GITHUB_SHA::7}" -o build/bin/NullDrive.exe .

  windows-installer:
    name: Windows installer (cross-built on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Build installer, portable zip and winget manifests
        run: scripts/build-windows.sh "$(node -p "require('./client/wails.json').info.productVersion")-ci.${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v7
        with:
          name: NullDrive-windows
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 14

  msix:
    name: Microsoft Store package (MSIX)
    needs: windows-installer
    # MakeAppx and MakePri come with the Windows SDK on the Windows image.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: NullDrive-windows
          path: dist
      - name: Take NullDrive.exe from the portable zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "NullDrive*.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath portable
          New-Item -ItemType Directory -Force client/build/bin | Out-Null
          $exe = Get-ChildItem portable -Recurse -Filter NullDrive.exe | Select-Object -First 1
          Copy-Item $exe.FullName client/build/bin/NullDrive.exe
      - name: Build the MSIX (Partner Center identity)
        shell: bash
        run: scripts/build-msix.sh "$(node -p "require('./client/wails.json').info.productVersion")-ci.${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v7
        with:
          name: NullDrive-msix
          path: dist/*.msix
          retention-days: 14

  packages:
    name: Release packaging (.deb + Docker archive, installed and run)
    runs-on: ubuntu-24.04
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build what release.yml builds
        run: |
          make ui-build
          ./scripts/build-release.sh v0.0.0-ci "$(git rev-parse --short HEAD)"
          ./scripts/build-deb.sh 0.0.0-ci dist
          ./scripts/build-image-offline.sh 0.0.0-ci dist
          ls -la dist
      - name: Install the .deb (systemd starts the service)
        run: |
          fail() { echo "::error::$*"; sudo journalctl -u nulldrive --no-pager -n 30 | sed 's/^/::error::journal: /'; exit 1; }
          sudo apt-get install -y ./dist/nulldrive_0.0.0-ci_amd64.deb || fail "apt install failed"
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8080/api/v1/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"' || fail "no healthy server on :8080 after install"
          systemctl is-active --quiet nulldrive || fail "nulldrive.service is not active"
          # the data dir is 0750 nulldrive:nulldrive, so look inside it as root
          owner=$(sudo stat -c %U /var/lib/nulldrive/nulldrive.db) || fail "no database in /var/lib/nulldrive"
          [ "$owner" = nulldrive ] || fail "database owned by $owner, not nulldrive"
          sudo apt-get purge -y nulldrive || fail "apt purge failed"
          if systemctl is-active --quiet nulldrive; then fail "still running after purge"; fi
          sudo test -d /var/lib/nulldrive || fail "purge deleted /var/lib/nulldrive"
      - name: Load and run the Docker archive
        run: |
          docker load -i dist/nulldrive_0.0.0-ci_docker_amd64.tar
          docker run -d --name nd -p 18080:8080 nulldrive:0.0.0-ci
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:18080/api/v1/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/api/v1/health | grep -q '"version":"v0.0.0-ci"'
          docker exec nd /nulldrive version | grep -q v0.0.0-ci

  linux-desktop:
    name: Desktop app (Linux) — build, packages, sync e2e
    runs-on: ubuntu-24.04
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/frontend/package-lock.json
            ui/package-lock.json
      - name: Install WebKitGTK, GTK and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb gnome-keyring libsecret-tools desktop-file-utils xdg-utils rpm
      - name: Build AppImage, .rpm, .deb and .tar.gz
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          scripts/build-linux-desktop.sh 0.0.0-ci dist
      - name: Go vet + tests (client, real Linux)
        working-directory: client
        run: |
          go vet -tags webkit2_41 ./...
          go test -tags webkit2_41 ./...
      - name: Check the packages
        run: |
          fail() { echo "::error::$*"; exit 1; }
          desktop-file-validate client/build/linux/nulldrive-desktop.desktop || fail "invalid .desktop file"
          rpm=dist/nulldrive-desktop-0.0.0-ci-1.x86_64.rpm
          rpm -qpR "$rpm" | grep -qx 'libwebkit2gtk-4.1.so.0()(64bit)' || fail "rpm does not require WebKitGTK 4.1"
          # Files only: an rpm that claims shared folders conflicts with Fedora's own packages.
          if rpm -qpl "$rpm" | grep -qxE '/usr(/share(/icons(/hicolor)?|/applications)?|/bin)?'; then fail "rpm claims system folders"; fi
          dpkg-deb -f dist/nulldrive-desktop_0.0.0-ci_amd64.deb Depends | grep -q libwebkit2gtk-4.1-0 || fail "deb does not depend on WebKitGTK 4.1"
      - name: Install the .deb
        run: |
          sudo apt-get install -y ./dist/nulldrive-desktop_0.0.0-ci_amd64.deb
          grep -q '^x-scheme-handler/nulldrive=nulldrive-desktop.desktop' /usr/share/applications/mimeinfo.cache ||
            { echo "::error::nulldrive:// handler not registered by the .deb"; exit 1; }
      - name: The .tar.gz installs and uninstalls for one user
        run: |
          home="$RUNNER_TEMP/tarhome"; mkdir -p "$home"
          tar -xzf dist/nulldrive-desktop_0.0.0-ci_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          HOME="$home" "$RUNNER_TEMP/nulldrive-desktop_0.0.0-ci_linux_amd64/install.sh"
          test -x "$home/.local/bin/nulldrive-desktop"
          desktop-file-validate "$home/.local/share/applications/nulldrive-desktop.desktop"
          HOME="$home" "$RUNNER_TEMP/nulldrive-desktop_0.0.0-ci_linux_amd64/install.sh" --uninstall
          test ! -e "$home/.local/bin/nulldrive-desktop"
      - name: Build the server
        run: make build
      - name: Sync end to end (AppImage, then the installed .deb)
        run: |
          xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- \
            scripts/e2e-linux-desktop.sh dist/NullDrive-0.0.0-ci-x86_64.AppImage bin/nulldrive "$RUNNER_TEMP/linux-desktop.png"
          xvfb-run -a dbus-run-session -- scripts/e2e-linux-desktop.sh /usr/bin/nulldrive-desktop bin/nulldrive
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: NullDrive-linux
          path: |
            dist/*.AppImage
            dist/*.rpm
            dist/nulldrive-desktop*
            ${{ runner.temp }}/linux-desktop.png
          retention-days: 14

  actionlint:
    name: Lint workflows, versions, scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: actionlint (pinned)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
      - name: App version is the same everywhere
        run: |
          app=$(python3 -c "import json;print(json.load(open('client/wails.json'))['info']['productVersion'])")
          for f in ui/package.json client/frontend/package.json; do
            v=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$f")
            if [ "$v" != "$app" ]; then echo "::error file=$f::version $v, but client/wails.json says $app"; exit 1; fi
          done
          echo "version $app"
      - name: Shell scripts (shellcheck)
        run: shellcheck scripts/*.sh scripts/e2ee-reference/*.sh
