name: zz-tidy
on:
  push:
    branches: [deps-2026-10-20]
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          go mod tidy
          (cd client && go mod tidy)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/zz-tidy.yml
          git add go.mod go.sum client/go.mod client/go.sum
          git commit -m "go mod tidy (server and desktop client) after the Go dependency updates"
          git push origin HEAD:deps-2026-10-20
