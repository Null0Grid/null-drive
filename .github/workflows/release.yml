# Release: push a tag like v0.3.0 → tests run → multi-arch image on GHCR,
# binaries for linux/macOS/windows (amd64 + arm64) with checksums, and a
# GitHub Release with auto-generated notes.
#
#   git tag -a v0.3.0 -m "v0.3.0" && git push origin v0.3.0
#
# Tags with a hyphen (v0.4.0-rc.1) become pre-releases and do not move :latest.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  security:
    uses: ./.github/workflows/security.yml

  image:
    name: Image → GHCR
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io/<owner>/nulldrive
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 → :1.2.3, :1.2, :v1.2.3 and :latest (latest only for
          # non-prerelease tags).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=Null Drive
            org.opencontainers.image.description=Self-hosted file sync server with a built-in web UI
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA provenance + SBOM attached to the image manifest.
          provenance: mode=max
          sbom: true

  binaries:
    name: Binaries
    needs: [ci, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        run: make ui-build
      - name: Cross-compile and package
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop app (Windows installer)
    needs: [ci, security]
    runs-on: ubuntu-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - name: Install NSIS and osslsigncode
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis osslsigncode
      # Optional code signing: add the repository secrets
      # WINDOWS_CERT_PFX_BASE64 (base64 of a .pfx code-signing certificate)
      # and WINDOWS_CERT_PASSWORD. Without them the build is unsigned.
      - name: Code-signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          echo "WINDOWS_CERT_PFX=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
      - name: Build installer, portable zip and winget manifests
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: scripts/build-windows.sh "$GITHUB_REF_NAME"
      - name: Remove certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.pfx"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            dist/*.exe
            dist/*.zip
            dist/winget/*.yaml
          if-no-files-found: error

  store:
    name: Microsoft Store package (MSIX)
    needs: desktop
    runs-on: windows-latest
    # Partner Center › Product management › Product identity. Set these as
    # repository variables (Settings › Secrets and variables › Actions ›
    # Variables); until then the package has placeholder identity values
    # the Store would reject.
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: dist
      - name: Take NullDrive.exe from the portable zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "NullDrive_*_windows_amd64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath portable
          New-Item -ItemType Directory -Force client/build/bin | Out-Null
          $exe = Get-ChildItem portable -Recurse -Filter NullDrive.exe | Select-Object -First 1
          Copy-Item $exe.FullName client/build/bin/NullDrive.exe
      - name: Build the MSIX
        shell: bash
        run: |
          # Empty repository variables mean "use the script's defaults".
          for v in MSIX_IDENTITY_NAME MSIX_PUBLISHER MSIX_PUBLISHER_DISPLAY_NAME; do
            [[ -n "${!v}" ]] || unset "$v"
          done
          scripts/build-msix.sh "$GITHUB_REF_NAME"
      # Not attached to the GitHub release: an unsigned MSIX doesn't install
      # by double-click. It's the file to upload in Partner Center (the
      # Store signs it); see docs/STORE.md.
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: dist/*.msix
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [image, binaries, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: dist
      - name: Checksums for everything attached
        run: cd dist && sha256sum -- *.tar.gz *.zip *.exe > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          cat > notes.md <<NOTES
          ## Install

          \`\`\`bash
          docker run -d --name nulldrive -p 8080:8080 -v nulldrive-data:/data --restart unless-stopped ${image}:${TAG#v}
          \`\`\`

          **Desktop app (Windows 10/11, 64-bit):** \`NullDrive-${TAG#v}-Setup.exe\` below installs for your account, no admin needed. Prefer no installer? \`NullDrive_${TAG#v}_windows_amd64.zip\` is the same app, portable. If the build isn't code-signed, Windows SmartScreen asks first: *More info → Run anyway*.

          Or download a server binary below (verify with \`SHA256SUMS.txt\`). Full guide: [docs/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/INSTALL.md).
          NOTES
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/*.exe dist/SHA256SUMS.txt dist/winget/*.yaml \
            --verify-tag \
            --title "Null Drive $TAG" \
            --notes-file notes.md \
            --generate-notes \
            "${prerelease[@]}"
