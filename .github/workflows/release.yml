name: Release

# Push a tag that matches the app version (client/wails.json
# info.productVersion), with or without a "v": 5.0.1 or v5.0.1. Or, for a tag
# that already exists: Actions → Release → Run workflow, and type the tag.
#
# Runs the full CI and security checks on that tag, then builds everything
# Null Drive ships and attaches it to the release for that tag (an existing
# release keeps its published/draft state; a new one is published):
#   - server archives for Linux, macOS and Windows (amd64 + arm64)
#   - .deb packages (amd64 + arm64) and Docker image archives (docker load)
#   - the Windows desktop app: installer, portable zip, winget manifests
#   - the Linux desktop app (amd64 + arm64): AppImage, .rpm, .deb, .tar.gz
#   - SHA256SUMS.txt
# Also pushes the multi-arch image to ghcr.io/<owner>/<repo> (lowercase).
# The Microsoft Store .msix is a workflow artifact only (store-package): it's
# unsigned and meant for Partner Center, which signs it.
#
# Hyphenated tags (5.1.0-rc.1) don't move the image's :latest.

on:
  push:
    tags: ["v*", "[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release (e.g. 5.0.0)"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Check tag matches the app version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: v
        run: |
          app=$(python3 -c "import json;print(json.load(open('client/wails.json'))['info']['productVersion'])")
          tag="${TAG#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::tag $TAG but client/wails.json says $app"
            exit 1
          fi
          for f in ui/package.json client/frontend/package.json; do
            v=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$f")
            if [ "$v" != "$app" ]; then echo "::error file=$f::version $v, expected $app"; exit 1; fi
          done
          {
            echo "version=$app"
            echo "minor=$(echo "$app" | cut -d. -f1,2)"
            if [[ "$app" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  security:
    needs: version
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  image:
    name: Image → GHCR
    needs: [version, ci, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # 5.0.1 → :5.0.1, :5.0 and :latest (not for pre-releases).
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Null Drive
            org.opencontainers.image.description=Self-hosted file sync server with a built-in web UI
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=v${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  server:
    name: Server archives, .deb, Docker archives
    needs: [version, ci, security]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web app
        run: make ui-build
      - name: Server archives (6 OS/arch)
        run: ./scripts/build-release.sh "v$VERSION" "$(git rev-parse --short HEAD)"
      - name: .deb packages
        run: ./scripts/build-deb.sh "$VERSION" dist
      - name: Docker image archives
        run: ./scripts/build-image-offline.sh "$VERSION" dist
      - name: Check the server reports the tagged version
        run: |
          tar -xzf "dist/nulldrive_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/nulldrive_${VERSION}_linux_amd64/nulldrive" version | tee /dev/stderr | grep -q "v$VERSION "
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*_docker_*.tar
          if-no-files-found: error

  desktop:
    name: Desktop app (Windows installer)
    needs: [version, ci, security]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - name: Install NSIS and osslsigncode
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis osslsigncode
      # Optional code signing: repository secrets WINDOWS_CERT_PFX_BASE64
      # (base64 of a .pfx code-signing certificate) and WINDOWS_CERT_PASSWORD.
      # Without them the build is unsigned.
      - name: Code-signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          echo "WINDOWS_CERT_PFX=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
      - name: Installer, portable zip and winget manifests
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          RELEASE_TAG: ${{ env.TAG }}
        run: scripts/build-windows.sh "$VERSION"
      - name: Remove certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.pfx"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop
          path: |
            dist/*.exe
            dist/*.zip
            dist/winget/*.yaml
          if-no-files-found: error

  linux-desktop:
    name: Desktop app (Linux ${{ matrix.arch }})
    needs: [version, ci, security]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            client/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/frontend/package-lock.json
            ui/package-lock.json
      - name: Install WebKitGTK and GTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: AppImage, .rpm, .deb and .tar.gz
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          scripts/build-linux-desktop.sh "$VERSION" dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-desktop-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.rpm
            dist/nulldrive-desktop_*
          if-no-files-found: error

  store:
    name: Microsoft Store package (MSIX)
    needs: [version, desktop]
    runs-on: windows-latest
    # The Partner Center identity (NULLGRID.NullDrive, Store ID 9P3NQGJ8ZZMG)
    # is build-msix.sh's default. Repository variables MSIX_IDENTITY_NAME,
    # MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME override it if ever needed.
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: desktop
          path: dist
      - name: Take NullDrive.exe from the portable zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "NullDrive*.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath portable
          New-Item -ItemType Directory -Force client/build/bin | Out-Null
          $exe = Get-ChildItem portable -Recurse -Filter NullDrive.exe | Select-Object -First 1
          Copy-Item $exe.FullName client/build/bin/NullDrive.exe
      - name: Build the MSIX
        shell: bash
        run: |
          # Empty repository variables mean "use the script's defaults".
          for v in MSIX_IDENTITY_NAME MSIX_PUBLISHER MSIX_PUBLISHER_DISPLAY_NAME; do
            [[ -n "${!v}" ]] || unset "$v"
          done
          scripts/build-msix.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: store-package
          path: dist/*.msix
          if-no-files-found: error

  release:
    name: Attach to the GitHub release
    needs: [version, image, server, desktop, linux-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: desktop
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-desktop-*
          merge-multiple: true
          path: dist
      - name: Portable zip name (tags built before 5.0.1 used the old one)
        run: |
          # GitHub release asset names are case-insensitive: the old
          # NullDrive_<v>_windows_amd64.zip collides with the server archive
          # nulldrive_<v>_windows_amd64.zip.
          shopt -s nullglob
          for f in dist/NullDrive_*_windows_amd64.zip; do mv -v "$f" "dist/NullDrive-${VERSION}-portable.zip"; done
          # Fail here, not halfway through the upload, if two files would
          # still collide.
          dup=$(find dist -maxdepth 1 -type f -printf '%f\n' | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$dup" ]; then echo "::error::asset names that differ only in case: $dup"; exit 1; fi
      - name: Checksums for everything attached
        run: cd dist && sha256sum -- *.tar.gz *.zip *.exe *.deb *.rpm *.AppImage *.tar > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Install notes (added once, so a re-run doesn't repeat them)
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | grep -q '^## Install'; then
            echo "the release already has install notes"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Install

          **Server, Docker:**
          ```
          docker run -d --name nulldrive -p 8080:8080 -v nulldrive-data:/data --restart unless-stopped @IMAGE@:@VERSION@
          ```
          No registry? `docker load -i nulldrive_@VERSION@_docker_amd64.tar` (or `_arm64`), then run `nulldrive:@VERSION@`.

          **Server, Ubuntu / Debian:** `sudo apt install ./nulldrive_@VERSION@_amd64.deb` (or `_arm64.deb`). Runs as the `nulldrive` service on port 8080.

          **Server, anything else:** the `nulldrive_@VERSION@_<os>_<arch>` archive for your system.

          **Desktop app (Windows 10/11):** `NullDrive-@VERSION@-Setup.exe` installs for your account, no admin needed; `NullDrive-@VERSION@-portable.zip` is the same app without an installer. If the build isn't code-signed, SmartScreen asks first: *More info → Run anyway*.

          **Desktop app (Linux, x86_64 and arm64):** `NullDrive-@VERSION@-x86_64.AppImage` runs on any distro without installing (`chmod +x`, then run it). Or install it: `sudo apt install ./nulldrive-desktop_@VERSION@_amd64.deb` (Debian, Ubuntu, Mint), `sudo dnf install ./nulldrive-desktop-@VERSION@-1.x86_64.rpm` (Fedora, RHEL; `zypper install` on openSUSE), or unpack `nulldrive-desktop_@VERSION@_linux_amd64.tar.gz` and run `./install.sh`. Needs WebKitGTK 4.1, which most desktops already have.

          Then open `http://<server>:8080` and create the admin account. Verify downloads with `SHA256SUMS.txt`. Full guide: [docs/INSTALL.md](https://github.com/@REPO@/blob/@TAG@/docs/INSTALL.md).

          **Microsoft Store:** https://apps.microsoft.com/detail/9P3NQGJ8ZZMG (updates itself). The Store package for this version is in this run's `store-package` artifact (upload it in Partner Center).
          EOF
          sed -i -e "s|@VERSION@|$VERSION|g" -e "s|@IMAGE@|$IMAGE|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" -e "s|@TAG@|$TAG|g" "$RUNNER_TEMP/notes.md"
          echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Null Drive ${{ needs.version.outputs.version }}
          append_body: true
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*_docker_*.tar
            dist/SHA256SUMS.txt
            dist/winget/*.yaml
      - name: Every file is on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Everything in SHA256SUMS.txt, the checksums and the winget
          # manifests must be attached: a file built but left off the upload
          # list fails here instead of passing silently.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort > "$RUNNER_TEMP/attached"
          { awk '{print $2}' dist/SHA256SUMS.txt; echo SHA256SUMS.txt; (cd dist/winget && ls -- *.yaml); } | sort > "$RUNNER_TEMP/expected"
          missing=$(comm -23 "$RUNNER_TEMP/expected" "$RUNNER_TEMP/attached")
          if [ -n "$missing" ]; then
            while read -r f; do echo "::error::not attached to the release: $f"; done <<< "$missing"
            exit 1
          fi
          echo "all $(wc -l < "$RUNNER_TEMP/expected") files attached"
