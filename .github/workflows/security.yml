# Security scans: known-vulnerable dependencies (Go and npm). Runs on
# every push/PR and weekly, so a newly published advisory against an
# existing dependency shows up even when nothing changed here.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_call:
    inputs:
      ref:
        description: "Git ref to scan (release.yml passes the tag)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (server + shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # govulncheck reports only vulnerabilities in code that is actually
      # reachable from ours (call-graph analysis), so a finding here is
      # worth acting on, not noise.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  govulncheck-client:
    name: govulncheck (desktop client)
    # The Wails client needs native headers on Linux; Windows has none.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: client/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [ui, client/frontend]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # What ships to users (the built UI) must have no high or critical
      # advisories; build tooling is held to critical only, since it never
      # runs in a browser or on the server.
      - name: Production dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: All dependencies (critical)
        run: npm audit --audit-level=critical
