# CodeQL static analysis for the Go server/client and the TypeScript UI:
# injection, path traversal, unsafe crypto use, XSS sinks and similar.
# Results appear under Security → Code scanning.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 3" # Wednesdays 04:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
